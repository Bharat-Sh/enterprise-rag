# Local development stack.
#
#   docker compose -f docker/compose.yml up -d
#
# Every backing service the platform will need, wired so the API cannot start
# before its dependencies are actually accepting connections. Racing a database
# that is still initialising produces "connection refused" flakes that cost more
# debugging time than the healthchecks cost to write.

name: enterprise-rag

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
      # Speeds up local resets; never use this in a real deployment.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # TODO(M5): pin to the version matching the qdrant-client we build against.
    # A floating tag is tolerable only because nothing depends on it until M5.
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    # No healthcheck: the image ships no shell, curl, or wget, so there is
    # nothing to exec. Added in M5 alongside the client, which can probe it
    # properly from the API side.

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      RAG_ENVIRONMENT: local
      RAG_LOG_LEVEL: INFO
      # Service names, not localhost — inside the compose network these resolve
      # to the other containers.
      RAG_DATABASE__HOST: postgres
      RAG_DATABASE__PASSWORD: rag
      RAG_REDIS__HOST: redis
      RAG_QDRANT__HOST: qdrant
      # Reaches the GPU model service (M4). On Windows, when running that
      # service natively on the host rather than in a container, change this to
      # http://host.docker.internal:8001
      RAG_MODEL_SERVICE__BASE_URL: http://model-service:8001
    ports:
      - "8000:8000"
    volumes:
      # Shared with the worker: the API writes uploaded bytes and the worker
      # reads them back. With the filesystem adapter they *must* see the same
      # storage, which is the single-node limitation ADR-0009 names — the S3
      # adapter is what removes this coupling.
      - blob-data:/var/lib/rag
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Same image as the API, different command. Separate from it because parsing
  # is blocking CPU work: running it in the API process would stall every
  # concurrent request, and the two scale on different signals — ingestion is
  # bursty, serving is not.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    command: ["rag-worker"]
    environment:
      RAG_ENVIRONMENT: local
      RAG_LOG_LEVEL: INFO
      RAG_DATABASE__HOST: postgres
      RAG_DATABASE__PASSWORD: rag
      RAG_REDIS__HOST: redis
      RAG_QDRANT__HOST: qdrant
      RAG_MODEL_SERVICE__BASE_URL: http://model-service:8001
    volumes:
      - blob-data:/var/lib/rag
    depends_on:
      postgres:
        condition: service_healthy
    # One job at a time per process, so scale by replica count. A worker that a
    # malformed document kills takes one job with it rather than a batch.
    deploy:
      replicas: 1

  # The GPU model service (docs/adr/0004, docs/adr/0011). Behind a profile, so
  # `docker compose up` on a machine with no GPU still brings up everything
  # else — the API and worker treat it as an optional dependency and only
  # retrieval needs it, which does not exist before M6.
  #
  #   docker compose -f docker/compose.yml --profile gpu up -d
  #
  # Weights are not in the image (2.3 GB, versioned independently of the code).
  # Populate the volume first, from the repository root:
  #
  #   uv run python scripts/fetch_models.py --root ./var/models
  #   docker run --rm -v enterprise-rag_model-data:/dst -v "$PWD/var/models:/src" \
  #     alpine cp -r /src/. /dst/
  model-service:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.model
    restart: unless-stopped
    environment:
      MODEL_SERVICE_LOG_LEVEL: INFO
      MODEL_SERVICE_DEVICE: cuda
      # Conservative for a 6 GB card. Both models resident leave roughly 2.5 GB
      # for activations, and attention memory is quadratic in sequence length —
      # BGE-M3's full 8192 window does not fit and we have no use for it, since
      # chunks target 512 tokens. See docs/adr/0011.
      MODEL_SERVICE_MAX_SEQUENCE_TOKENS: "1024"
      MODEL_SERVICE_MAX_BATCH_TOKENS: "8192"
    ports:
      - "8001:8001"
    volumes:
      - model-data:/opt/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres-data:
  redis-data:
  blob-data:
  qdrant-data:
  # Model weights, kept out of the image so a code change does not reship 2.3 GB.
  model-data:
