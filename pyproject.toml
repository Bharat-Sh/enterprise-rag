[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Production-grade multi-tenant Enterprise RAG platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # `[email]` pulls in email-validator, which `EmailStr` needs at runtime.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # PyJWT rather than python-jose (unmaintained, looser algorithm handling) or
    # authlib (a whole OAuth framework where we need sign and verify).
    "pyjwt[crypto]>=2.10",
    # argon2-cffi directly rather than passlib, which is unmaintained and whose
    # bcrypt backend broke outright against bcrypt>=4.1.
    "argon2-cffi>=23.1",
    # Required by FastAPI to accept multipart/form-data uploads.
    "python-multipart>=0.0.20",
    # PDF text extraction. Pure Python, MIT. PyMuPDF is faster and pdfplumber
    # gives better layout, but PyMuPDF is AGPL — which would reach this whole
    # codebase, and this repository is MIT and intended to go public.
    "pypdf>=5.1",
    # Safe XML parsing for DOCX, which is a zip of XML. The stdlib parser
    # expands internal entities, which is billion-laughs; `defusedxml` is the
    # drop-in that does not. Not needed for HTML — `html.parser` has no entity
    # expansion to disable.
    "defusedxml>=0.7.1",
    # M4: the client for the GPU model service. `requests` is blocking, which
    # violates non-negotiable #6; `aiohttp` is a second dependency with no sync
    # client and nothing gained. httpx was already here for tests.
    "httpx>=0.28",
    # M4: BGE-M3's vocabulary, for exact chunk sizing. The Rust library, a few
    # megabytes, no torch. `transformers.AutoTokenizer` does the same job while
    # dragging torch into the CPU-only worker on most install paths.
    "tokenizers>=0.20",
    # M5: the vector index. >=1.12 for the Query API (`query_points`, prefetch,
    # server-side RRF) that M6's fusion needs — adopting the older `search` API
    # now would mean rewriting the adapter one milestone later. The client also
    # ships an embedded local mode, which is how the vector store is exercised
    # on a machine with no Docker (CLAUDE.md).
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    # defusedxml ships no inline types, and mypy runs strict.
    "types-defusedxml>=0.7",
]

# ---------------------------------------------------------------------------
# The GPU model service (docs/adr/0004, docs/adr/0011). Installed only where a
# GPU exists — `uv sync --extra gpu` — which is why it is an extra rather than a
# dependency: torch plus CUDA is 5-7 GB, and the API and worker never load a
# model. They reach one over HTTP.
#
# `huggingface-hub` is here rather than in the base dependencies because only
# `scripts/fetch_models.py` needs it, and only on a machine that is about to
# download weights. Runtime never touches the hub: model paths are local.
# ---------------------------------------------------------------------------
gpu = [
    "torch>=2.4",
    # BAAI's own package. It implements BGE-M3's `sparse_linear` head, the
    # token-weight max-pooling and the special-token exclusion that produce the
    # sparse output. Reimplementing that on raw `transformers` is forty lines
    # that fail silently when wrong — not a crash, just quietly worse retrieval
    # that nothing detects until the M10 golden set.
    "FlagEmbedding>=1.3",
    "huggingface-hub>=0.26",
]

[project.scripts]
# Bootstrap and break-glass only. A fresh deployment has no tenant and no user,
# and every endpoint requires a credential; something has to create the first one.
rag-admin = "rag.cli:main"
# The ingestion worker. A separate process from the API on purpose: parsing is
# blocking CPU work, and running it in a request handler would stall every
# concurrent request on that worker (CLAUDE.md non-negotiable #6).
rag-worker = "rag.worker.__main__:main"
# The GPU model service. Runs only where the `gpu` extra is installed; the
# console script exists everywhere because shipping the source costs a few
# hundred kilobytes and the thing being kept out of the API image is torch, not
# these modules.
rag-model-service = "model_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/model_service"]


# ---------------------------------------------------------------------------
# Ruff — linter AND formatter. We deliberately do not use Black: `ruff format`
# is a drop-in replacement, and running both means two tools arguing over the
# same file.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async  (blocking calls in async defs — critical for us)
    "S",     # flake8-bandit (security)
    "ANN",   # flake8-annotations (type hints everywhere)
    "RUF",   # ruff-specific
]
ignore = [
    "ANN401", # `Any` is legitimate in a few generic seams
    "S104",   # binding 0.0.0.0 is correct inside a container
]

[tool.ruff.lint.per-file-ignores]
# assert + fixture ergonomics, plus S105/S106: a suite that exercises
# authentication is *made of* literal credentials, and bandit's heuristic reads
# variable names. Suppressed for tests only — it stays on for src/, where a
# hardcoded secret is exactly what we want flagged.
"tests/**/*.py" = ["S101", "S105", "S106", "ANN001", "ANN201", "ANN202"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.ruff.format]
docstring-code-format = true


# ---------------------------------------------------------------------------
# mypy — strict everywhere. Relaxed only for tests, where fixture plumbing
# makes full annotation noise outweigh the benefit.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["rag", "model_service"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# FlagEmbedding ships no type information and is not installed outside the `gpu`
# extra, so `model_service.flag` would otherwise fail type-checking on
# every machine without a GPU — including CI. Narrowed to that one package
# rather than turning the setting on globally.
[[tool.mypy.overrides]]
module = ["FlagEmbedding.*"]
ignore_missing_imports = true

# `tokenizers` ships a `.pyi` but no `py.typed` marker, so mypy will not use it.
# There is no stub package to install; the alternative is a hand-written stub
# for two methods, which would then be wrong the first time the library changes.
[[tool.mypy.overrides]]
module = ["tokenizers.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires real backing services (docker compose up)",
    "security: cross-tenant leakage and ACL bypass — never skip, never xfail",
    "e2e: full end-to-end flow",
]

[tool.coverage.run]
source = ["src/rag", "src/model_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true


# ---------------------------------------------------------------------------
# import-linter — the architecture rules from docs/adr/0003, enforced by CI.
# An architectural boundary that isn't checked by a machine is a comment.
#
# `forbidden_modules` lists only packages that are actually installed; it grows
# as we add adapters (sqlalchemy in M1, qdrant_client in M5, anthropic in M8).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["rag", "model_service"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure — no infrastructure, no delivery, no frameworks"
type = "forbidden"
source_modules = ["rag.domain"]
forbidden_modules = [
    "rag.api",
    "rag.adapters",
    "rag.db",
    "rag.services",
    "fastapi",
    "starlette",
    # M2: credential *formats* are domain logic and use nothing but hashlib and
    # secrets. The libraries that sign tokens and stretch passwords are vendor
    # choices, and belong to adapters.
    "jwt",
    "argon2",
    # M3b: parsing libraries are vendor choices. The domain owns what a
    # document *is*, never how a PDF is decoded.
    "pypdf",
    "defusedxml",
    # M5: the domain owns what a vector *is* (`rag.domain.retrieval`), never how
    # Qdrant serialises a filter. This is the contract that keeps `pgvector` a
    # realistic swap rather than a rewrite — see ADR-0001's closing note.
    "qdrant_client",
]

[[tool.importlinter.contracts]]
name = "Services depend on ports, never on concrete adapters"
type = "forbidden"
source_modules = ["rag.services"]
forbidden_modules = [
    "rag.adapters",
    "rag.api",
    "rag.db",
    "jwt",
    "argon2",
    "pypdf",
    "defusedxml",
    # M5: `RetrievalService` and `IngestionPipeline` take the `VectorStore`
    # port. A service that imported the Qdrant client would be a service that
    # could only ever run against Qdrant.
    "qdrant_client",
]

[[tool.importlinter.contracts]]
name = "Core is the base layer and depends on nothing of ours"
type = "forbidden"
source_modules = ["rag.core"]
forbidden_modules = [
    "rag.api",
    "rag.adapters",
    "rag.db",
    "rag.services",
    "rag.domain",
]

# M4. The whole point of putting the model service behind HTTP (docs/adr/0004)
# is that `rag` never needs torch. A single convenience import — one shared
# constant, one reused dataclass — would put a 5-7 GB CUDA stack back into the
# API's and the worker's dependency closure, and it would happen by accident.
# The two ends talk over the wire and nowhere else.
[[tool.importlinter.contracts]]
name = "The API and worker never import the model service"
type = "forbidden"
source_modules = ["rag"]
forbidden_modules = ["model_service", "torch", "FlagEmbedding"]

# The reverse arrow *is* allowed, but only as far as `rag.core`, so all three
# processes emit the same structured log shape. Anything deeper would make the
# GPU image depend on the database stack it never opens.
[[tool.importlinter.contracts]]
name = "The model service borrows rag.core and nothing else of ours"
type = "forbidden"
source_modules = ["model_service"]
forbidden_modules = [
    "rag.api",
    "rag.adapters",
    "rag.db",
    "rag.domain",
    "rag.services",
    "rag.worker",
]
