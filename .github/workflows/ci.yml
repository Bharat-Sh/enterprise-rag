name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, architecture, tests
    runs-on: ubuntu-latest

    # Integration tests auto-skip when no database is reachable, so without this
    # they would pass by not running — the worst kind of green build. The RLS
    # and SKIP LOCKED tests are the ones most worth having in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # Gate 1 — style. `ruff format --check` fails on unformatted code rather
      # than reformatting it, so formatting never lands as a surprise diff.
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # Gate 2 — types.
      - name: Type check
        run: uv run mypy

      # Gate 3 — architecture. The hexagonal boundaries from docs/adr/0003 are
      # checked by a machine; a rule enforced only by code review is a comment.
      - name: Architecture contracts
        run: uv run lint-imports

      # Gate 4 — migrations must be replayable, not one-way.
      #
      # An upgrade/downgrade/upgrade cycle. The first version of the initial
      # migration passed a plain `upgrade` but failed the second one:
      # autogenerate drops tables without dropping the Postgres ENUM types they
      # created, so re-applying died on DuplicateObjectError. A schema that
      # cannot be rebuilt from zero is a schema you cannot restore.
      - name: Migration round-trip
        env:
          RAG_MIGRATION_DSN: postgresql+asyncpg://rag:rag@127.0.0.1:5432/rag_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current

      # Gate 5 — behaviour. Unit and integration together; the integration tests
      # run against the service container above.
      - name: Tests
        env:
          RAG_TEST_DB_HOST: 127.0.0.1
          RAG_TEST_DB_PORT: "5432"
          RAG_TEST_DB_USER: rag
          RAG_TEST_DB_PASSWORD: rag
          RAG_TEST_DB_NAME: rag_test
        run: uv run pytest --cov=rag --cov-report=term-missing --cov-report=xml

      # Guards against the integration and security suites silently skipping in
      # CI, which would turn a security regression into a passing build.
      #
      # `tests/security` gets the same treatment for a stronger reason: CLAUDE.md
      # says those tests must never be skipped or marked xfail. Auto-skipping on
      # an unreachable database is honest on a developer laptop and unacceptable
      # here, where the database is a service container that is supposed to be up.
      - name: Assert integration and security tests actually ran
        env:
          RAG_TEST_DB_HOST: 127.0.0.1
          RAG_TEST_DB_PORT: "5432"
          RAG_TEST_DB_USER: rag
          RAG_TEST_DB_PASSWORD: rag
          RAG_TEST_DB_NAME: rag_test
        run: |
          for suite in integration security; do
            echo "::group::$suite"
            uv run pytest "tests/$suite" -q --no-header -p no:cacheprovider \
              | tee "/tmp/$suite.log"
            grep -qE '[0-9]+ passed' "/tmp/$suite.log"
            if grep -qE '[0-9]+ skipped' "/tmp/$suite.log"; then
              echo "::error::$suite tests were skipped — the database was unreachable."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: enterprise-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually starts and serves liveness, not just that it
      # compiles. A green build of a container that crashes on boot is worthless.
      - name: Smoke test the image
        run: |
          docker run -d --name rag-api -p 8000:8000 \
            -e RAG_ENVIRONMENT=local enterprise-rag-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is live"
              curl -fsS http://localhost:8000/health
              docker rm -f rag-api
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become live within 30s"
          docker logs rag-api
          docker rm -f rag-api
          exit 1
