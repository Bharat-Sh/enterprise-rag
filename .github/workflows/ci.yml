name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, architecture, tests
    runs-on: ubuntu-latest

    # Integration tests auto-skip when no database is reachable, so without this
    # they would pass by not running — the worst kind of green build. The RLS
    # and SKIP LOCKED tests are the ones most worth having in CI.
    # NOTE the superuser. `POSTGRES_USER` becomes the cluster's *bootstrap
    # superuser*, and a superuser bypasses row-level security unconditionally —
    # `FORCE ROW LEVEL SECURITY` does not apply to it. Running the suite as
    # `rag` therefore made every tenant-isolation test pass through a connection
    # that ignored RLS entirely, so they failed here while passing locally,
    # where `rag` is an ordinary role.
    #
    # So the container keeps `postgres` as its superuser and the application
    # role is created separately below, which reproduces the local and intended
    # production shape: `rag` owns its tables and is held by FORCE.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # A real Qdrant, not the client's embedded local mode. Local mode is what
      # the primary development machine uses (no Docker there — CLAUDE.md) and
      # it is honest about its limits: the client warns that **payload indexes
      # have no effect** in it, so every filter is a full scan. The isolation
      # tests are correct either way, but only here do they run against the
      # engine that production runs, with `is_tenant` co-location and the ACL
      # index actually in place.
      #
      # No healthcheck option: the image ships no shell, curl or wget, so there
      # is nothing to exec. The test fixtures probe the port themselves.
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - uses: actions/checkout@v4

      # Gate 0 — no source file is gitignored.
      #
      # M4 nearly shipped without `src/rag/adapters/models/`: `.gitignore`
      # carried an unanchored `models/` for downloaded weights, which matches at
      # any depth and silently swallowed the whole package. Everything worked on
      # the machine that wrote it and the file simply would not have existed in
      # the repository. Nothing else in the pipeline can catch that — the tests
      # pass, because the tests run against the working tree.
      # `__pycache__` is filtered out because it is *supposed* to be ignored and
      # would otherwise bury the one line that matters under a hundred that do
      # not — a check nobody can read is a check nobody acts on.
      - name: No source file is gitignored
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src/ tests/ scripts/ \
                   | grep -v '__pycache__' || true)
          if [ -n "$hidden" ]; then
            echo "::error::These source files are ignored by .gitignore and would never be committed:"
            echo "$hidden"
            exit 1
          fi
          echo "no ignored source files under src/, tests/ or scripts/"

      # Mirrors the developer machine described in CLAUDE.md: superuser
      # `postgres`, ordinary role `rag` owning the database it uses. A test
      # asserts the connecting role cannot bypass RLS, so if this step is ever
      # removed the suite says so in one line instead of seventeen.
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE rag LOGIN PASSWORD 'rag' NOSUPERUSER NOCREATEDB NOBYPASSRLS;" \
            -c "CREATE DATABASE rag_test OWNER rag;"
          psql -h 127.0.0.1 -U postgres -d rag_test -v ON_ERROR_STOP=1 \
            -c "GRANT ALL ON SCHEMA public TO rag;"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # Gate 1 — style. `ruff format --check` fails on unformatted code rather
      # than reformatting it, so formatting never lands as a surprise diff.
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # Gate 2 — types.
      - name: Type check
        run: uv run mypy

      # Gate 3 — architecture. The hexagonal boundaries from docs/adr/0003 are
      # checked by a machine; a rule enforced only by code review is a comment.
      - name: Architecture contracts
        run: uv run lint-imports

      # Gate 4 — migrations must be replayable, not one-way.
      #
      # An upgrade/downgrade/upgrade cycle. The first version of the initial
      # migration passed a plain `upgrade` but failed the second one:
      # autogenerate drops tables without dropping the Postgres ENUM types they
      # created, so re-applying died on DuplicateObjectError. A schema that
      # cannot be rebuilt from zero is a schema you cannot restore.
      - name: Migration round-trip
        env:
          RAG_MIGRATION_DSN: postgresql+asyncpg://rag:rag@127.0.0.1:5432/rag_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current

      # The model service, on the STUB backend (docs/adr/0011). There is no GPU
      # runner, but the thing worth testing across a process boundary is the
      # *contract* — status codes, batching, connection reuse, the two ends
      # agreeing on field names — and none of that needs a GPU. Without this the
      # model-service integration module would skip, and `assert_suites_ran.py`
      # would fail the build rather than let it pass silently.
      #
      # Not a service container: the image would have to be built first, and
      # this is one Python process that starts in under a second.
      # BGE-M3's vocabulary, so `BgeTokenCounter` is actually exercised here.
      # Without it those tests skip, and the class production is meant to use —
      # the one that decides whether a chunk fits the model's window — would be
      # covered on developer machines and nowhere else.
      #
      # Cached, because it is 17 MB of a file that changes about never, and
      # because reaching huggingface.co on every push makes an unrelated outage
      # look like our bug. A fetch failure fails the step rather than silently
      # dropping back to skipping: the `tests/unit` suite has no skip guard, so
      # losing this coverage would otherwise be invisible.
      - name: Cache the BGE-M3 tokenizer
        uses: actions/cache@v4
        with:
          path: var/models
          key: bge-m3-tokenizer-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch the BGE-M3 tokenizer
        run: |
          if [ -f var/models/bge-m3/tokenizer.json ]; then
            echo "restored from cache"
          else
            uv pip install huggingface-hub
            uv run python scripts/fetch_models.py --tokenizer-only
          fi

      #
      # Launched as `.venv/bin/rag-model-service`, **not** `uv run ...`, and that
      # matters. A backgrounded process survives for the rest of the job, so
      # `uv run` would leave a live `uv` holding the cache — and `setup-uv`'s
      # post-job prune then hangs for five minutes and fails the build with
      # every real step green. The console script has no uv in its process tree.
      - name: Start the model service (stub backend)
        env:
          MODEL_SERVICE_BACKEND: stub
          MODEL_SERVICE_LOG_LEVEL: WARNING
        run: |
          .venv/bin/rag-model-service &
          echo $! > model-service.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ready > /dev/null 2>&1; then
              echo "model service is ready (pid $(cat model-service.pid))"
              exit 0
            fi
            sleep 1
          done
          echo "model service failed to become ready within 30s"
          exit 1

      # Gate 5 — behaviour. Unit and integration together; the integration tests
      # run against the service container above.
      - name: Tests
        env:
          RAG_TEST_DB_HOST: 127.0.0.1
          RAG_TEST_DB_PORT: "5432"
          RAG_TEST_DB_USER: rag
          RAG_TEST_DB_PASSWORD: rag
          RAG_TEST_DB_NAME: rag_test
          RAG_TEST_MODEL_SERVICE_URL: http://127.0.0.1:8001
          RAG_TEST_QDRANT_HOST: 127.0.0.1
          RAG_TEST_QDRANT_PORT: "6333"
        run: |
          uv run pytest --cov=rag --cov-report=term-missing --cov-report=xml \
            --junitxml=junit.xml

      # Guards against the integration and security suites silently skipping,
      # which would turn a data-leak regression into a green build. `tests/
      # security` gets the same treatment for a stronger reason: CLAUDE.md says
      # those must never be skipped or marked xfail.
      #
      # Asserts on the JUnit XML from the run above rather than re-running the
      # suites, so the check covers the same run that produced the coverage and
      # CI does not pay twice for the slowest suite. `if: always()` because a
      # skipped suite is worth reporting even when something else failed.
      - name: Assert integration and security tests actually ran
        if: always()
        run: uv run python scripts/assert_suites_ran.py junit.xml

      # Stopped explicitly rather than left to the runner. A background process
      # that outlives the steps needing it is how the previous run failed: it
      # was still holding the uv cache during post-job cleanup. `if: always()`
      # so a failing test suite does not also leave this behind.
      - name: Stop the model service
        if: always()
        run: |
          if [ -f model-service.pid ]; then
            kill "$(cat model-service.pid)" 2>/dev/null || true
            rm -f model-service.pid
          fi
          pkill -f rag-model-service || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: enterprise-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually starts and serves liveness, not just that it
      # compiles. A green build of a container that crashes on boot is worthless.
      - name: Smoke test the image
        run: |
          docker run -d --name rag-api -p 8000:8000 \
            -e RAG_ENVIRONMENT=local enterprise-rag-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is live"
              curl -fsS http://localhost:8000/health
              docker rm -f rag-api
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become live within 30s"
          docker logs rag-api
          docker rm -f rag-api
          exit 1

      # The GPU image is *checked*, not built. A full build pulls torch and the
      # bundled CUDA runtime — 5-7 GB on every push, for an image no CI runner
      # can execute anyway, since there is no GPU to smoke-test it against.
      #
      # `--check` runs buildx's Dockerfile linter: syntax, stage references,
      # unset variables, bad `COPY --from`. That catches the ways this file
      # actually rots between the rare occasions someone builds it, at a cost of
      # a couple of seconds. It does **not** prove the image builds — see
      # docs/adr/0011 for why that is the accepted trade rather than an
      # oversight.
      - name: Check the model-service Dockerfile
        run: docker buildx build --check -f docker/Dockerfile.model .
