# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: the connection string is built from
# `rag.core.config.Settings` in migrations/env.py, so there is exactly one
# source of truth for it. Duplicating the DSN here is how a migration ends up
# running against the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, ordered filenames. The default is a bare hash, which sorts
# meaninglessly in a directory listing and tells a reviewer nothing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
